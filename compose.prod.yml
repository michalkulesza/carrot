services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: platekeeper
      POSTGRES_USER: platekeeper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platekeeper"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    image: ghcr.io/michalkulesza/carrot-api:latest
    env_file: .env
    environment:
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      RENDERER_URL: http://renderer:8080
    depends_on:
      db:
        condition: service_healthy
      renderer:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5

  renderer:
    image: ghcr.io/michalkulesza/carrot-renderer:latest
    environment:
      RENDERER_MAX_CONCURRENCY: ${RENDERER_MAX_CONCURRENCY:-2}
      RENDERER_MAX_HTML_BYTES: ${RENDERER_MAX_HTML_BYTES:-2097152}
      RENDERER_MAX_RESPONSE_BYTES: ${RENDERER_MAX_RESPONSE_BYTES:-8388608}
      RENDERER_MAX_REQUESTS: ${RENDERER_MAX_REQUESTS:-200}
      RENDERER_NAVIGATION_TIMEOUT_MS: ${RENDERER_NAVIGATION_TIMEOUT_MS:-15000}
      RENDERER_TOTAL_TIMEOUT_MS: ${RENDERER_TOTAL_TIMEOUT_MS:-25000}
      RENDERER_IDLE_MS: ${RENDERER_IDLE_MS:-1200}
    mem_limit: 1200m
    cpus: 2
    pids_limit: 256
    cap_drop: ["ALL"]
    cap_add: ["NET_ADMIN", "SETUID", "SETGID"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    image: ghcr.io/michalkulesza/carrot-api:latest
    command: ["uv", "run", "--no-sync", "python", "-m", "api.worker"]
    env_file: .env
    environment:
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      RENDERER_URL: http://renderer:8080
    depends_on:
      db:
        condition: service_healthy
      renderer:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ghcr.io/michalkulesza/carrot-web:latest
    ports:
      - "127.0.0.1:8089:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  showcase:
    image: ghcr.io/michalkulesza/carrot-showcase:latest
    ports:
      - "127.0.0.1:8090:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: platekeeper_postgres_data
